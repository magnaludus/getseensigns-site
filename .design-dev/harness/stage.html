<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stage harness</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/design/editor.css">
<body style="margin:0;background:#EEE">
<div id="host" style="width:100vw;height:70vh"></div>
<div id="live" aria-live="polite" style="font:14px sans-serif;padding:6px"></div>
<script type="module">
import { createMeasurer, loadFonts } from '/assets/design/render/measure.js';
import { createDocument } from '/assets/design/model/document.js';
import { createStore } from '/assets/design/store.js';
import { createActions } from '/assets/design/editor/actions.js';
import { createStage } from '/assets/design/editor/stage-svg.js';

const q = new URLSearchParams(location.search);
const [catalog, specs, templates] = await Promise.all(['catalog', 'print-specs', 'templates'].map((n) => fetch(`/assets/design/${n}.json`).then((r) => r.json())));
const measure = createMeasurer(catalog.fonts);
const env = { catalog, specs, templates, fonts: catalog.fonts, measure };
await loadFonts(catalog.fonts, measure);
const choices = q.get('choices') ? JSON.parse(q.get('choices')) : {};
const doc = createDocument(env, q.get('product') || 'banner', { templateId: q.get('template') || undefined, choices });
const store = createStore(doc, env, {});
const actions = createActions(store);
const live = document.getElementById('live');
const stage = createStage(document.getElementById('host'), { store, actions, announce: (m) => { live.textContent = m; } });
window.__app = { store, actions, stage, env };
window.__ready = true;
</script>
