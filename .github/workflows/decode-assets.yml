name: Unpack site bundle
on:
  push:
    branches: [main]
    paths: ['site-bundle.tgz.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle, verify checksums, commit files
        run: |
          set -euo pipefail
          base64 -d site-bundle.tgz.b64 > /tmp/site.tgz
          tar xzf /tmp/site.tgz -C .
          sha256sum -c SHA256SUMS
          git rm -q site-bundle.tgz.b64 SHA256SUMS .github/workflows/decode-assets.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add gameday mockup images"
          git push
